name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        id: test
        shell: pwsh
        run: cargo test --workspace --all-targets 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\test.log"
      - name: Annotate failures
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\test.log") {
            Get-Content "$env:RUNNER_TEMP\test.log" | Select-Object -Last 40 |
              ForEach-Object { Write-Host "::error::CI-TAIL $_" }
          }
      - name: Isolated Windhawk runtime host
        shell: pwsh
        run: |
          cargo build -p termielle-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p termielle-app --example windhawk_host_review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts\review-windhawk-runtime.ps1 -BinDir target\debug
      - name: Consolidated x86 Windhawk runtime
        shell: pwsh
        run: |
          cargo test -p termielle-runtime --target i686-pc-windows-msvc --features windhawk-x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p termielle-runtime --target i686-pc-windows-msvc --features windhawk-x86 --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p termielle-app --target i686-pc-windows-msvc --example windhawk_host_review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts\review-windhawk-runtime.ps1 -BinDir target\i686-pc-windows-msvc\debug -Consolidated
      - name: Doctor
        shell: pwsh
        run: pwsh -NoProfile -File scripts\doctor.ps1 -BinDir target\debug
      - name: Benchmark report
        shell: pwsh
        run: pwsh -NoProfile -File scripts\benchmark.ps1 -Samples 5 -Warmups 2 -WorkingSetSeconds 2 -DurationSeconds 2 -BinDir target\debug -NoBuild -ReportOnly

  # The overlay itself is Windows-only, but the protocol, the transport, and
  # the emitter are not: core, ipc, and emit must build and pass their suites
  # on Linux, where the Unix-domain-socket backend is the code under test.
  cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p termielle-core -p termielle-ipc -p termielle-emit --all-targets -- -D warnings
      - name: Test
        run: cargo test -p termielle-core -p termielle-ipc -p termielle-emit --all-targets
