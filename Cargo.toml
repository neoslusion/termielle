[workspace]
members = [
  "crates/termielle-core",
  "crates/termielle-ipc",
  "crates/termielle-emit",
  "crates/termielle-asset",
  "crates/termielle-app",
  "crates/termielle-runtime",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
windows = "0.62.2"
windows-future = "0.3.2"
tempfile = "3.27.0"
gif = "0.14.2"
toml = "1.1.4"
